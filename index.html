<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Lumen — a mockup of an interactive learning world for physics, maths, chemistry, art, music and planet Earth." />
<title>Lumen — one world of knowledge</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="9" opacity=".45" />
            <path d="M3 12h18M12 3v18" opacity=".25" />
            <circle cx="12" cy="12" r="4.2" />
            <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <span class="brand-name">Lumen</span>
      </div>

      <div class="crumbs" id="crumbs"></div>

      <div class="tools">
        <button class="tool" id="btn-search" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <span>Search</span>
        </button>
        <button class="tool" id="btn-snapshot" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 16.5V7a2 2 0 012-2h2.3l1.3-2h4.8l1.3 2H18a2 2 0 012 2v9.5a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg>
          <span>Snapshot</span>
        </button>
        <button class="tool" id="btn-design" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3.5h8l4 4v13a1 1 0 01-1 1H6a1 1 0 01-1-1v-16a1 1 0 011-1z"/><path d="M14 3.5v4.2h4.2"/><path d="M8.4 12h7.2M8.4 15.4h5"/></svg>
          <span>Design</span>
        </button>
      </div>
    </header>

    <nav class="rail" id="rail" aria-label="Subjects"></nav>

    <main class="stage" id="stage">
      <div class="stage-fade" aria-hidden="true"></div>
    </main>

    <aside class="coach" id="coach" aria-label="Lesson coach">
      <div class="coach-inner" id="coach-inner"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
